<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday My Love 💖</title>
    
    <!-- Load Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&family=Mali:wght@400;500;600&display=swap" rel="stylesheet">
    
    <!-- Load Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Kanit', 'sans-serif'],
                        cute: ['Mali', 'cursive'],
                    },
                    colors: {
                        pink: {
                            50: '#fdf2f8',
                            100: '#fce7f3',
                            200: '#fbcfe8',
                            300: '#f9a8d4',
                            400: '#f472b6',
                            500: '#ec4899',
                            600: '#db2777',
                        }
                    },
                    animation: {
                        'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                        'bounce-slow': 'bounce 3s infinite',
                    }
                }
            }
        }
    </script>

    <!-- Load FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        body {
            margin: 0;
            overflow-x: hidden;
            background: linear-gradient(135deg, #fdf2f8 0%, #fbcfe8 100%);
            min-height: 100vh;
        }

        /* Glassmorphism Card */
        .glass-card {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0 10px 40px 0 rgba(236, 72, 153, 0.15);
        }

        /* Heart Balloon Animation */
        .balloon-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        .balloon {
            position: absolute;
            bottom: -100px;
            width: 40px;
            height: 40px;
            background-color: transparent;
            opacity: 0;
            animation: floatUp ease-in infinite;
        }

        .balloon svg {
            width: 100%;
            height: 100%;
            fill: #f9a8d4;
            filter: drop-shadow(0px 4px 6px rgba(236,72,153,0.3));
        }

        @keyframes floatUp {
            0% {
                transform: translateY(0) scale(0.5) rotate(0deg);
                opacity: 0;
            }
            10% {
                opacity: 0.7;
            }
            90% {
                opacity: 0.7;
            }
            100% {
                transform: translateY(-120vh) scale(1.2) rotate(45deg);
                opacity: 0;
            }
        }

        /* Smooth Fade Transitions for Image and Text */
        .fade-transition {
            transition: opacity 0.5s ease-in-out, transform 0.5s ease-in-out;
        }
        
        .fade-out {
            opacity: 0;
            transform: scale(0.98);
        }
        
        .fade-in {
            opacity: 1;
            transform: scale(1);
        }
    </style>
</head>
<body class="text-gray-800 antialiased font-sans relative">

    <!-- Heart Balloons Background Container -->
    <div class="balloon-container" id="balloonContainer"></div>

    <!-- Main Content Wrapper -->
    <div class="relative z-10 min-h-screen flex flex-col items-center justify-center p-4 py-8 md:py-12">
        
        <!-- Main Card -->
        <div class="glass-card rounded-[2rem] w-full max-w-2xl p-6 md:p-10 text-center relative overflow-hidden">
            
            <!-- Decorative corner elements -->
            <div class="absolute -top-10 -left-10 text-pink-300 opacity-30 text-8xl transform -rotate-45 pointer-events-none">
                <i class="fas fa-heart"></i>
            </div>
            <div class="absolute -bottom-10 -right-10 text-pink-300 opacity-30 text-8xl transform rotate-45 pointer-events-none">
                <i class="fas fa-heart"></i>
            </div>

            <!-- Header -->
            <h1 class="text-4xl md:text-5xl font-cute font-bold text-pink-500 mb-2 drop-shadow-sm animate-pulse-slow">
                Happy Birthday!
            </h1>
            <h2 class="text-xl md:text-2xl text-pink-400 font-medium mb-6">
                To My Dearest Love <i class="fas fa-heart text-pink-500 animate-bounce-slow inline-block"></i>
            </h2>

            <!-- Synchronized Slideshow Section -->
            <div class="w-full flex flex-col items-center mb-8 relative group">
                
                <!-- Image Display -->
                <div class="w-full aspect-[4/3] sm:aspect-[16/10] rounded-2xl overflow-hidden shadow-lg border-4 border-white bg-pink-50 relative">
                    <img id="slideImage" src="" alt="Our Memory" class="w-full h-full object-cover fade-transition fade-in">
                    
                    <!-- Navigation Controls overlay on image -->
                    <button onclick="prevSlide()" class="absolute left-3 top-1/2 transform -translate-y-1/2 bg-white/80 hover:bg-white text-pink-500 rounded-full w-10 h-10 flex items-center justify-center shadow-md transition duration-300 opacity-0 group-hover:opacity-100 focus:opacity-100 z-10">
                        <i class="fas fa-chevron-left"></i>
                    </button>
                    <button onclick="nextSlide()" class="absolute right-3 top-1/2 transform -translate-y-1/2 bg-white/80 hover:bg-white text-pink-500 rounded-full w-10 h-10 flex items-center justify-center shadow-md transition duration-300 opacity-0 group-hover:opacity-100 focus:opacity-100 z-10">
                        <i class="fas fa-chevron-right"></i>
                    </button>
                </div>

                <!-- Dynamic Message Section (Changes with Image) -->
                <div class="bg-white/80 rounded-2xl p-6 shadow-sm mt-6 border border-pink-100 relative w-11/12 md:w-5/6 -mt-8 z-20 transition-all duration-300 hover:shadow-md">
                    <i class="fas fa-quote-left text-pink-300 text-2xl absolute top-3 left-4 opacity-40"></i>
                    
                    <p id="slideMessage" class="text-lg md:text-xl leading-relaxed text-gray-700 font-cute relative pt-2 px-4 pb-1 fade-transition fade-in min-h-[80px] flex items-center justify-center">
                        <!-- Text will be injected here via JS -->
                    </p>
                    
                    <i class="fas fa-quote-right text-pink-300 text-2xl absolute bottom-3 right-4 opacity-40"></i>
                </div>

                <!-- Indicators -->
                <div class="flex justify-center gap-2 mt-6" id="sliderIndicators">
                    <!-- Dots will be inserted here by JS -->
                </div>
            </div>

            <!-- Audio Player Section -->
            <div class="flex flex-col items-center justify-center space-y-4 mt-4">
                <p class="text-pink-600 font-medium text-sm md:text-base">
                    🎵 เปิดเพลงเพื่อเพิ่มความหวานซึ้ง 🎵
                </p>
                
                <!-- Hidden Audio Element -->
                <audio id="bgm" src="https://assets.mixkit.co/music/preview/mixkit-romantic-piano-and-strings-108.mp3" loop preload="auto"></audio>

                <!-- Custom Audio Control -->
                <button id="playBtn" onclick="toggleAudio()" class="relative flex items-center justify-center gap-3 bg-gradient-to-r from-pink-400 to-pink-500 hover:from-pink-500 hover:to-pink-600 text-white px-8 py-3 rounded-full font-medium shadow-lg hover:shadow-xl transition-all duration-300 transform hover:-translate-y-1">
                    <i id="playIcon" class="fas fa-play"></i>
                    <span id="playText">Play Our Song</span>
                    
                    <!-- Decorative music notes -->
                    <div id="musicNotes" class="absolute -top-4 right-2 text-pink-400 hidden animate-bounce-slow text-lg">
                        <i class="fas fa-music"></i>
                    </div>
                </button>
            </div>

        </div>
        
        <!-- Footer -->
        <p class="text-pink-500/80 text-sm mt-8 font-cute text-center drop-shadow-sm">
            Made with <i class="fas fa-heart text-pink-500 animate-pulse-slow"></i> just for you
        </p>
    </div>

    <script>
        // --- 1. BALLOON ANIMATION LOGIC ---
        const balloonContainer = document.getElementById('balloonContainer');
        const colors = ['#f9a8d4', '#f472b6', '#fbcfe8', '#fda4af', '#fce7f3'];
        
        const heartSvg = `<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>`;

        function createBalloon() {
            const balloon = document.createElement('div');
            balloon.classList.add('balloon');
            
            const leftPosition = Math.random() * 100;
            const animationDuration = Math.random() * 8 + 7;
            const size = Math.random() * 25 + 20; 
            const color = colors[Math.floor(Math.random() * colors.length)];
            
            balloon.style.left = `${leftPosition}vw`;
            balloon.style.animationDuration = `${animationDuration}s`;
            balloon.style.width = `${size}px`;
            balloon.style.height = `${size}px`;
            
            balloon.innerHTML = heartSvg;
            balloon.querySelector('svg').style.fill = color;

            balloonContainer.appendChild(balloon);

            setTimeout(() => {
                balloon.remove();
            }, animationDuration * 1000);
        }

        setInterval(createBalloon, 800);
        for(let i = 0; i < 6; i++) {
            setTimeout(createBalloon, i * 200);
        }

        // --- 2. SYNCHRONIZED SLIDESHOW LOGIC ---
        // Data array connecting images to specific messages
        const slideData = [
            {
                img: "https://placehold.co/800x600/ffb6c1/ffffff?text=Our+First+Date",
                text: "รูปนี้จำได้ไหม? เดทแรกของเรา เค้าตื่นเต้นมากเลยนะที่ได้เจอกับคนที่น่ารักขนาดนี้ 😊"
            },
            {
                img: "https://placehold.co/800x600/ffc0cb/ffffff?text=Happy+Memories",
                text: "รอยยิ้มของเตงในวันนั้น ทำให้โลกทั้งใบของเค้าสดใสขึ้นมาทันทีเลยรู้ไหม 🌟"
            },
            {
                img: "https://placehold.co/800x600/ff69b4/ffffff?text=Smiling+Together",
                text: "ทุกๆ ครั้งที่เราได้ไปเที่ยวด้วยกัน มันคือช่วงเวลาที่มีความสุขที่สุดในชีวิตเค้าเลย 🚗💨"
            },
            {
                img: "https://placehold.co/800x600/ff1493/ffffff?text=I+Love+You",
                text: "สุขสันต์วันเกิดนะที่รัก ขอให้เราได้สร้างความทรงจำดีๆ แบบนี้ด้วยกันตลอดไปเลยนะ รักที่สุด! 💖🎂"
            }
        ];

        let currentSlideIndex = 0;
        const slideImage = document.getElementById('slideImage');
        const slideMessage = document.getElementById('slideMessage');
        const indicatorsContainer = document.getElementById('sliderIndicators');
        let isTransitioning = false;

        // Initialize Dots
        function initIndicators() {
            slideData.forEach((_, index) => {
                const dot = document.createElement('button');
                dot.className = `w-2.5 h-2.5 rounded-full transition-all duration-300 ${index === 0 ? 'bg-pink-500 w-6' : 'bg-pink-300/50 hover:bg-pink-400'}`;
                dot.onclick = () => goToSlide(index);
                indicatorsContainer.appendChild(dot);
            });
        }

        // Render Slide with Smooth Transition
        function renderSlide(index) {
            if (isTransitioning) return;
            isTransitioning = true;

            // Fade out current content
            slideImage.classList.replace('fade-in', 'fade-out');
            slideMessage.classList.replace('fade-in', 'fade-out');

            setTimeout(() => {
                // Update content after fade out
                slideImage.src = slideData[index].img;
                slideMessage.innerHTML = slideData[index].text;
                
                // Update Dots UI
                const dots = indicatorsContainer.children;
                for (let i = 0; i < dots.length; i++) {
                    if (i === index) {
                        dots[i].className = 'w-6 h-2.5 rounded-full transition-all duration-300 bg-pink-500 shadow';
                    } else {
                        dots[i].className = 'w-2.5 h-2.5 rounded-full transition-all duration-300 bg-pink-300/60 hover:bg-pink-400';
                    }
                }

                // Wait a tiny bit for the image source to register, then fade in
                requestAnimationFrame(() => {
                    slideImage.classList.replace('fade-out', 'fade-in');
                    slideMessage.classList.replace('fade-out', 'fade-in');
                    
                    // Release lock after fade in completes
                    setTimeout(() => {
                        isTransitioning = false;
                    }, 500); 
                });
            }, 400); // Wait for fade-out to finish
        }

        function nextSlide() {
            if (isTransitioning) return;
            currentSlideIndex = (currentSlideIndex + 1) % slideData.length;
            renderSlide(currentSlideIndex);
            resetAutoSlide();
        }

        function prevSlide() {
            if (isTransitioning) return;
            currentSlideIndex = (currentSlideIndex - 1 + slideData.length) % slideData.length;
            renderSlide(currentSlideIndex);
            resetAutoSlide();
        }

        function goToSlide(index) {
            if (isTransitioning || index === currentSlideIndex) return;
            currentSlideIndex = index;
            renderSlide(currentSlideIndex);
            resetAutoSlide();
        }

        // Auto slide
        let slideInterval;
        function startAutoSlide() {
            slideInterval = setInterval(nextSlide, 5000); // Change slide every 5 seconds
        }
        
        function resetAutoSlide() {
            clearInterval(slideInterval);
            startAutoSlide();
        }

        // Pause auto-slide on hover over the slideshow area
        const slideshowGroup = document.querySelector('.group');
        slideshowGroup.addEventListener('mouseenter', () => clearInterval(slideInterval));
        slideshowGroup.addEventListener('mouseleave', startAutoSlide);

        // Initial setup
        initIndicators();
        // Set initial content without transition delay
        slideImage.src = slideData[0].img;
        slideMessage.innerHTML = slideData[0].text;
        startAutoSlide();

        // --- 3. AUDIO PLAYER LOGIC ---
        const bgm = document.getElementById('bgm');
        const playBtn = document.getElementById('playBtn');
        const playIcon = document.getElementById('playIcon');
        const playText = document.getElementById('playText');
        const musicNotes = document.getElementById('musicNotes');
        let isPlaying = false;

        function toggleAudio() {
            if (isPlaying) {
                bgm.pause();
                playIcon.className = 'fas fa-play';
                playText.innerText = 'Play Our Song';
                playBtn.classList.remove('shadow-[0_0_15px_rgba(236,72,153,0.5)]');
                musicNotes.classList.add('hidden');
            } else {
                bgm.play().then(() => {
                    playIcon.className = 'fas fa-pause';
                    playText.innerText = 'Pause Song';
                    playBtn.classList.add('shadow-[0_0_15px_rgba(236,72,153,0.5)]');
                    musicNotes.classList.remove('hidden');
                }).catch(error => {
                    console.log("Audio playback was prevented.", error);
                    // Use custom UI instead of alert, but for brevity in this single file falling back to console
                });
            }
            isPlaying = !isPlaying;
        }
    </script>
</body>
</html>
